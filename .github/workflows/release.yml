name: Release

# Builds KonayukiPlus.exe and the installer and publishes them as a GitHub release.
#
#   - push a tag:      git tag v2026.10.14 && git push origin v2026.10.14
#   - or run it here:  Actions > Release > Run workflow (version defaults to today's date)
#
# The server base URL comes from the KONAYUKI_HOST repository secret (it is kept out of the source;
# see ServerConfig.example.cs). The maintainer's server polls the latest release, verifies it against
# SHA256SUMS.txt and publishes it to the update manifest, so installed copies update themselves.
# Pre-releases are not picked up by the server.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, e.g. v2026.10.14 (empty = today's date)
        required: false
        default: ''
      prerelease:
        description: Pre-release (a test build the server does not publish to users)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      KONAYUKI_HOST: ${{ secrets.KONAYUKI_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve the release tag
        id: tag
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:EVENT -eq 'push') {
            $tag = $env:REF_NAME
          } else {
            $tag = "$env:INPUT_VERSION".Trim()
            if (-not $tag) { $tag = 'v' + [DateTime]::UtcNow.ToString('yyyy.MM.dd') }
            if ($tag -notmatch '^v[0-9A-Za-z._-]{1,40}$') { throw "Invalid version '$tag' (expected something like v2026.10.14)" }
            git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
            if ($LASTEXITCODE -eq 0) { $tag = "$tag.$env:RUN_NUMBER" }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "Release tag: $tag"
          exit 0

      - name: Configure the server URL
        shell: pwsh
        run: |
          if (-not $env:KONAYUKI_HOST) { throw 'The KONAYUKI_HOST repository secret is not set (Settings > Secrets and variables > Actions).' }
          if ($env:KONAYUKI_HOST -notmatch '^https://[A-Za-z0-9.-]+(/[A-Za-z0-9._-]+)*/?$') { throw 'KONAYUKI_HOST must be a plain https:// URL.' }
          $lines = @(
            'namespace KonayukiPlus;',
            '',
            '// Generated by the release workflow from the KONAYUKI_HOST repository secret.',
            'internal static class ServerConfig',
            '{',
            ('    public const string Host = "{0}";' -f $env:KONAYUKI_HOST.TrimEnd('/')),
            '}'
          )
          Set-Content -Path src/KonayukiPlus/KonayukiPlus/ServerConfig.local.cs -Value $lines -Encoding utf8

      - name: Install NSIS
        shell: pwsh
        run: |
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) { choco install nsis -y --no-progress | Out-Null }
          & $makensis /VERSION
          exit 0

      - name: Download the installer payload
        shell: pwsh
        run: ./tools/installer/fetch-payload.ps1 -BaseUrl $env:KONAYUKI_HOST -OutDir "$PWD\build\payload"

      - name: Build the app and the installer
        shell: pwsh
        run: ./tools/installer/build-setup.ps1 -PayloadDir "$PWD\build\payload"

      - name: Collect the release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/setup/KONAYUKI_PLUS_V6U1_SETUP.exe, src/KonayukiPlus/bin/Release/KonayukiPlus.exe dist/
          $sums = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          Set-Content dist/SHA256SUMS.txt $sums -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $setupUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/KONAYUKI_PLUS_V6U1_SETUP.exe"
          @(
            '## Install',
            '',
            "1. Download **[KONAYUKI_PLUS_V6U1_SETUP.exe]($setupUrl)** and run it (Windows 10/11, 64-bit).",
            '2. Start KONAYUKI PLUS. The first start downloads its tools (FFmpeg, AviSynth+, mpv, codecs; about 300 MB). Keep it open until the main window appears.',
            '',
            'Already installed? Nothing to do: the app updates itself the next time it starts.',
            '',
            'Windows SmartScreen may warn about the installer because it is not code-signed. Choose **More info > Run anyway**.',
            '',
            "What's new: https://cdn.v6u1.lol/konayuki/plus_changelog.html"
          ) | Set-Content notes.md -Encoding utf8
          $ghArgs = @($env:TAG, 'dist/KONAYUKI_PLUS_V6U1_SETUP.exe', 'dist/KonayukiPlus.exe', 'dist/SHA256SUMS.txt',
                      '--title', "KONAYUKI PLUS $env:TAG", '--notes-file', 'notes.md', '--generate-notes')
          if ($env:EVENT -ne 'push') { $ghArgs += @('--target', $env:GITHUB_SHA) }
          if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' } else { $ghArgs += '--latest' }
          gh release create @ghArgs
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
